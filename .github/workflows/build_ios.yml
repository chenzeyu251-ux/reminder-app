name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA on macOS
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Select latest Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Swift trailing comma compatibility
        run: |
          find ~/.pub-cache -name "*.swift" -exec sed -i '' -E 's/,([[:space:]]*\))/\1/g' {} + || true

      - name: Build iOS Application (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA format
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -9 reminder_app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reminder_app_ios_ipa
          path: reminder_app.ipa
          retention-days: 14

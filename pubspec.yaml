name: reminder_app
description: "即使提要 - 极简个人事要提醒应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  home_widget: ^0.10.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  shared_preferences_foundation: 2.5.4

flutter:
  uses-material-design: true
  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/AppFont.ttf
